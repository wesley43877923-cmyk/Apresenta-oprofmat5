<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definições de Gradientes -->
  <defs>
    <linearGradient id="uerj-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056b3" />
      <stop offset="100%" stop-color="#002b66" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ccac00" />
    </linearGradient>
  </defs>

  <!-- Escudo Azul da UERJ -->
  <path d="M 40 30 
           L 160 30 
           C 160 110, 140 150, 100 175 
           C 60 150, 40 110, 40 30 Z" 
        fill="url(#uerj-blue)" 
        stroke="url(#gold-grad)" 
        stroke-width="4" 
        filter="drop-shadow(0px 3px 5px rgba(0,0,0,0.3))" />

  <!-- Cruz Estilizada Interna (Branca) -->
  <path d="M 92 45 L 108 45 L 108 80 L 140 80 L 140 96 L 108 96 L 108 145 L 92 145 L 92 96 L 60 96 L 60 80 L 92 80 Z" 
        fill="#ffffff" />

  <!-- Esfera no Centro da Cruz (Símbolo UERJ) -->
  <circle cx="100" cy="88" r="14" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Linhas horizontais e verticais cruzando a esfera -->
  <line x1="86" y1="88" x2="114" y2="88" stroke="#ffffff" stroke-width="1.5" />
  <line x1="100" y1="74" x2="100" y2="102" stroke="#ffffff" stroke-width="1.5" />
</svg>
